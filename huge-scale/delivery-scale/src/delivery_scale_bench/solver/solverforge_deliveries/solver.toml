# The solverforge-deliveries search policy, measured on ds-s10000 at 300 s
# (SolverForge 0.31.2, four runs in parallel on separate physical cores, same
# conditions for every row):
#
#   construction                         local search            cost
#   cheapest insertion                   this file's selectors   1,477,795
#   SolverForge defaults (no phases)     default                   852,168
#   Clarke-Wright + insertion + 2-opt    this file's selectors     765,965
#
# - Construction is list_clarke_wright, then list_cheapest_insertion for the
#   stops the savings merges cannot place on the fixed fleet (about 6,400 of
#   10,000), then list_k_opt. Cheapest insertion from an empty plan spends
#   about 150 s building a worse start. Bounding the savings with
#   savings_neighbors cuts Clarke-Wright from 91 s to 19 s but leaves more
#   stops to insertion and ends worse (835,716 at 40; at 100 the 2-opt pass
#   ran 155 s and the plan ended infeasible).
# - No list_ruin_move_selector. Every local search with ruin moves (these
#   selectors plus the CVRP ruin pair, or the default local search) made a few
#   hundred steps in 150 s and ended with time windows or capacity violated.
# - The forager stays first_last_step_score_improving: the CVRP forager
#   (accepted_count 4, rotating round robin) scored 1,705,989 after the same
#   insertion start.
# The harness supplies the termination budget.

environment_mode = "reproducible"
random_seed = 42

[[phases]]
type = "construction_heuristic"
construction_heuristic_type = "list_clarke_wright"
entity_class = "Vehicle"
variable_name = "delivery_order"

[[phases]]
type = "construction_heuristic"
construction_heuristic_type = "list_cheapest_insertion"
entity_class = "Vehicle"
variable_name = "delivery_order"

[[phases]]
type = "construction_heuristic"
construction_heuristic_type = "list_k_opt"
k = 2
entity_class = "Vehicle"
variable_name = "delivery_order"

[[phases]]
type = "local_search"

[phases.acceptor]
type = "late_acceptance"
late_acceptance_size = 200

[phases.forager]
type = "first_last_step_score_improving"

[phases.move_selector]
type = "union_move_selector"

[[phases.move_selector.selectors]]
type = "nearby_list_change_move_selector"
max_nearby = 20
entity_class = "Vehicle"
variable_name = "delivery_order"

[[phases.move_selector.selectors]]
type = "nearby_list_swap_move_selector"
max_nearby = 20
entity_class = "Vehicle"
variable_name = "delivery_order"

[[phases.move_selector.selectors]]
type = "list_reverse_move_selector"
entity_class = "Vehicle"
variable_name = "delivery_order"

[[phases.move_selector.selectors]]
type = "k_opt_move_selector"
k = 3
min_segment_len = 1
max_nearby = 10
entity_class = "Vehicle"
variable_name = "delivery_order"

[[phases.move_selector.selectors]]
type = "limited_neighborhood"
selected_count_limit = 500

[phases.move_selector.selectors.selector]
type = "sublist_change_move_selector"
min_sublist_size = 1
max_sublist_size = 3
entity_class = "Vehicle"
variable_name = "delivery_order"
