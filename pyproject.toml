[project]
name = "solverforge-bench"
version = "0.1.2"
description = "Multi-problem benchmark suite for solver comparison"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "polars>=1.37.1",
    "pydantic>=2.12.5",
    "pyvrp>=0.14.0",
    "vrplib>=1.5.1",
    "hygese>=0.0.0.10",
    "psycopg[binary]>=3.2.0",
    "solverforge==0.6.10",
]

[tool.setuptools.packages.find]
where = [
    "src",
    "list-variable/cvrp/src",
    "scalar-variable/employee-scheduling/src",
    "scalar-variable/job-shop-scheduling/src",
]
# The solver adapter roots contain Rust and Java build trees. They carry no
# __init__.py, so namespace discovery walks into them, and cargo's transient
# rmeta scratch directories exist only for the duration of a build: discovery
# records one and the wheel build then fails because it is already gone. The
# benchmark harness never imports from a build tree, so exclude them outright
# instead of racing the compiler.
exclude = ["*.target*", "target*"]

[tool.setuptools.package-data]
"cvrp_bench.solver" = ["solverforge_py.toml"]
"employee_scheduling_bench.solver" = ["solverforge_py.toml"]
"job_shop_bench.solver" = ["solverforge_py.toml"]
